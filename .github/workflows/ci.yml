name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The fast tests only touch numpy/scipy code, so skip the heavy ML install.
      - run: pip install numpy scipy soundfile pytest
      - run: python -m compileall -q soundlift
      - run: PYTHONPATH=. pytest -q
